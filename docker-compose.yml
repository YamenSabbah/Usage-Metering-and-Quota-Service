services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metering_secret}
      POSTGRES_DB: ${POSTGRES_DB:-metering}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metering}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-metering}:${POSTGRES_PASSWORD:-metering_secret}@postgres:5432/${POSTGRES_DB:-metering}
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  client:
    image: nginx:alpine
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./example-client:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

volumes:
  pgdata:
